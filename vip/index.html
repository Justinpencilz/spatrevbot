      border-radius: 50%;

    p { font-size: 14px; color: #9aa4b8; margin-bottom: 24px; line-height: 1.5; }

      padding: 16px 20px;
      background: linear-gradient(135deg, #2b9df4, #6f42ff);
      color: #fff; font-size: 16px; font-weight: 700;
      text-decoration: none; border-radius: 14px;
      transition: transform 0.1s ease, filter 0.2s ease;
    }
    .btn:active { transform: scale(0.97); filter: brightness(1.1); }
    .channel { margin-top: 16px; font-size: 13px; color: #6b7688; }
